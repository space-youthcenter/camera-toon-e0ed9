<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#27231f" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="description" content="종이 카메라로 찍으면 화면 속만 색연필 그림이 되는 놀이 카메라" />
    <title>Camera Toon</title>
    <link rel="stylesheet" href="style.css?v=20" />
  </head>
  <body>
    <main class="camera-app">
      <header class="topbar">
        <div class="brand"><b>Camera</b> <em>Toon</em></div>
        <button id="flipButton" class="icon-button" type="button" aria-label="전면 카메라로 전환" hidden>↻</button>
      </header>

      <section id="stage" class="stage" aria-label="실시간 카메라 미리보기">
        <video id="cameraVideo" autoplay muted playsinline></video>
        <canvas id="liveCanvas"></canvas>
        <canvas id="frozenCanvas" aria-label="촬영이 완료된 정지 이미지"></canvas>

        <div id="permissionPanel" class="permission-panel">
          <div class="paper-camera-icon" aria-hidden="true"><i></i></div>
          <h1>종이 카메라를<br />깨워볼까요?</h1>
          <p id="permissionMessage">카메라를 허용하고 찰칵 찍으면, 종이 카메라 속만 색연필 그림으로 변해요.</p>
          <button id="startButton" class="start-button" type="button">카메라 시작</button>
          <small>기본 무료 모드는 사진을 전송하지 않고 기기 안에서 손그림으로 바꿔요.</small>
        </div>

        <div class="status" id="status" role="status" aria-live="polite">카메라를 준비하고 있어요…</div>

        <label id="zoomControl" class="zoom-control" hidden>
          <span id="zoomLabel">1.0×</span>
          <input id="zoomRange" type="range" min="1" max="4" step="0.1" value="1" aria-label="카메라 줌, 최대 4배" />
        </label>

        <div class="camera-controls" id="cameraControls" hidden>
          <button id="modeButton" class="mode-button checking" type="button" aria-label="촬영 처리 모드 변경">
            <strong id="modeName">AI 손그림</strong>
            <small id="connectionStatus">AI 확인 중...</small>
          </button>
          <button id="shutterButton" class="shutter" type="button" aria-label="사진 촬영"><i></i></button>
          <span class="control-spacer" aria-hidden="true"></span>
        </div>
      </section>
    </main>

    <section id="resultSheet" class="result-sheet" aria-label="촬영 결과" aria-hidden="true">
      <div class="sheet-card">
        <header><strong>찰칵! Camera Toon 완성</strong><button id="closeResult" type="button" aria-label="결과 닫기">×</button></header>
        <canvas id="resultCanvas"></canvas>
        <p id="resultMode" class="result-mode" role="status"></p>
        <div class="result-actions">
          <button id="retakeButton" class="secondary-button" type="button">다시 찍기</button>
          <button id="saveButton" class="save-button" type="button">↓ 사진 저장</button>
        </div>
        <p>iPhone에서는 저장 후 다운로드 항목에서 사진을 확인해 주세요.</p>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <img id="frameImage" src="assets/frame-camera.png" alt="" hidden />
    <script src="script.js?v=20"></script>
  </body>
</html>
